<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkmate Replay Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>Checkmate Replay Hub</h1>

    <p>
        Upload a chess replay file and confirm your submission by email.
    </p>

    <form id="uploadForm">

        <label>
            Email address
        </label>

        <input
            id="email"
            type="email"
            required
            placeholder="you@example.com"
        >

        <label>
            Chess replay file
        </label>

        <input
            id="file"
            type="file"
            required
            accept=".txt"
        >

        <button type="submit">
            Upload game
        </button>

    </form>

    <div id="status"></div>

</div>

<script src="app.js"></script>

</body>
</html>
