<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Checkmate Replay Hub</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <main class="container">

        <h1>Checkmate Replay Hub</h1>

        <p>
            Upload your chess replay file for processing.
        </p>

        <form id="submissionForm">

            <label for="email">
                Email address
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="you@example.com"
                required
            >

            <label for="file">
                Chess replay file
            </label>

            <input
                type="file"
                id="file"
                name="file"
                accept=".txt"
                required
            >

            <button
                type="submit"
                id="submitButton"
            >
                Submit replay
            </button>

        </form>

        <div class="status-box">

            <p>
                Status:
                <strong id="status">
                    READY
                </strong>
            </p>

            <p id="message"></p>

        </div>

    </main>

    <script src="app.js"></script>

</body>

</html>
