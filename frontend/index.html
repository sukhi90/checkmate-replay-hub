<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkmate Replay Hub</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; text-align: center; }
        .container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 500px; margin: auto; }
        h1 { color: #333; }
        input[type="email"], input[type="text"] { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #0056b3; }
        #message { margin-top: 15px; font-weight: bold; color: green; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Checkmate Replay Hub</h1>
        <p>Milestone 2 - Live Backend Integration Test</p>
        
        <input type="email" id="email" placeholder="Enter your email" required><br>
        <input type="text" id="fileName" placeholder="Enter file name (e.g., partie.txt)" required><br>
        <button onclick="submitData()">Submit to Live AWS Backend</button>
        
        <div id="message"></div>
    </div>

    <script>
        const API_URL = "https://6ms0w1zblk.execute-api.us-east-1.amazonaws.com/Prod";

        async function submitData() {
            const emailValue = document.getElementById('email').value;
            const fileNameValue = document.getElementById('fileName').value;
            const messageDiv = document.getElementById('message');

            if (!emailValue || !fileNameValue) {
                messageDiv.style.color = "red";
                messageDiv.innerText = "Please fill in all fields.";
                return;
            }

            messageDiv.style.color = "orange";
            messageDiv.innerText = "Submitting to AWS Cloud...";

            try {
                const response = await fetch(https://6ms0w1zblk.execute-api.us-east-1.amazonaws.com/Prod/submissions, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: emailValue, fileName: fileNameValue })
                });

                const data = await response.json();
                messageDiv.style.color = "green";
                messageDiv.innerText = "Success! AWS Lambda says: " + data.message;
            } catch (error) {
                console.error("Error:", error);
                messageDiv.style.color = "red";
                messageDiv.innerText = "Submission Failed. Check browser console.";
            }
        }
    </script>
</body>
</html>
